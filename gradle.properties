# COMPAT faz o daemon usar a codificação nativa do Windows. Sem isso, com JDK 18+ o Gradle grava
# o classpath dos testes em UTF-8 e o "ê" do caminho quebra o carregamento das classes de teste.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=COMPAT
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# O caminho do projeto contém "ê"; o AGP bloqueia caminhos não ASCII no Windows por padrão.
android.overridePathCheck=true
